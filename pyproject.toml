[project]
name = "ytlens"
version = "0.1.0"
description = "YouTube Video RAG Intelligence Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "youtube-transcript-api",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-huggingface",
    "langchain-openai",
    "langchain-pinecone",
    "sentence-transformers",
    "pinecone",
    "rank-bm25",
    "tiktoken",
    "python-dotenv",
    "sqlalchemy",
    "requests",
    "torch",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "jinja2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
